<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参加人数の登録</title>
<style>
:root { font-family: system-ui, sans-serif; line-height: 1.6; }
body { max-inline-size: 48rem; margin: 2rem auto; padding-inline: 1rem; }
button, select, input { font: inherit; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }

</style>
<body>
<h1>読書会の参加登録</h1>
<form id="booking">
  <label for="people">参加人数（1〜8人）</label>
  <input id="people" name="people" type="number" min="1" max="8" required>
  <button name="intent" value="book">登録</button>
  <button name="intent" value="draft" formnovalidate>下書きを保存</button>
</form>
<p id="receipt" role="status"></p>
<script>
const booking = document.querySelector('#booking');
booking.addEventListener('submit', (event) => {
  event.preventDefault();
  const draft = event.submitter?.value === 'draft';
  const count = booking.elements.namedItem('people').value;
  document.querySelector('#receipt').textContent = draft
    ? '下書きを受け付けました。'
    : count + '人の登録を受け付けました。';
});
</script>
</body>
</html>
