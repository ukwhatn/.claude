<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一覧の並べ替え</title>
<style>
:root { font-family: system-ui, sans-serif; line-height: 1.6; }
body { max-inline-size: 48rem; margin: 2rem auto; padding-inline: 1rem; }
button, select, input { font: inherit; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }

</style>
<body>
<h1>書架</h1>
<button id="reverse">順序を逆にする</button>
<ol id="shelves"><li>詩歌</li><li>随筆</li><li>紀行</li></ol>
<script>
const order = document.querySelector('#shelves');
const reverse = document.querySelector('#reverse');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
reverse.addEventListener('click', async () => {
  if (reverse.getAttribute('aria-disabled') === 'true') return;
  const reorder = () => order.replaceChildren(...Array.from(order.children).reverse());
  if (preference.matches || typeof document.startViewTransition !== 'function') {
    reorder();
    return;
  }
  reverse.setAttribute('aria-disabled', 'true');
  try { await document.startViewTransition(reorder).finished; }
  finally { reverse.removeAttribute('aria-disabled'); }
});
</script>
</body>
</html>
