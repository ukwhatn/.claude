<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸出数の推移</title>
<style>
:root { font-family: system-ui, sans-serif; line-height: 1.6; }
body { max-inline-size: 48rem; margin: 2rem auto; padding-inline: 1rem; }
button, select, input { font: inherit; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
figure { margin: 0; } img { display: block; width: min(100%, 480px); height: auto; }
</style>
<body>
<h1>分室の貸出記録</h1>
<figure>
  <img src="assets/circulation-240.png"
       srcset="assets/circulation-240.png 240w, assets/circulation-480.png 480w"
       sizes="(max-width: 512px) calc(100vw - 2rem), 480px"
       width="480" height="240" alt="4月4冊、5月7冊、6月6冊、7月9冊。">
  <figcaption>4月から7月までの貸出冊数（サンプルデータ）</figcaption>
</figure>
</body>
</html>
